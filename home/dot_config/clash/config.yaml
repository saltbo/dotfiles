#---------------------------------------------------#
## Place configuration files in $HOME/.config/clash/*.yaml.

## This is the base ClashX configuration. Use a separate file for custom rules.
## Only the port settings in this file take effect when ClashX starts.

## Documentation: https://github.com/Dreamacro/clash/blob/dev/README.md
#---------------------------------------------------#

# Port of HTTP(S) proxy server on the local end
port: 6666

# Port of SOCKS5 proxy server on the local end
socks-port: 6667

# RESTful API for clash
external-controller: 127.0.0.1:9090
allow-lan: false
mode: rule
log-level: warning

proxies:

proxy-groups:

rules:
  - DOMAIN-SUFFIX,google.com,DIRECT
  - DOMAIN-KEYWORD,google,DIRECT
  - DOMAIN,google.com,DIRECT
  - DOMAIN-SUFFIX,ad.com,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
